# Scrapes the metrics the OpenTelemetry Collector re-exports, so the demo can
# be inspected with PromQL alongside the IncidentDNA dashboard.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: incidentdna

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: incidentdna-backend
    metrics_path: /api/health
    static_configs:
      - targets: ["incidentdna:8000"]
