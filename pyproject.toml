[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incidentdna"
version = "1.0.0"
description = "AI-powered production incident investigator: detection, dependency-aware root-cause ranking and evidence generation over OpenTelemetry-shaped data"
requires-python = ">=3.10"
readme = "README.md"

[tool.setuptools.packages.find]
include = ["incidentdna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "--strict-markers -ra"
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore:Using `httpx` with `starlette.testclient`:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
